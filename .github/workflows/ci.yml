name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests with coverage
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.13'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Check code formatting with black
      run: black --check --diff app/ tests/ migrations/ config.py run.py scheduler_worker.py

    - name: Lint with flake8
      run: flake8 app/ tests/ migrations/ config.py run.py scheduler_worker.py

    - name: Migrations match the models
      env:
        APP_ENV: development
        DATABASE_URL: sqlite:////tmp/ci-migrations.db
      run: |
        flask --app run:app init-db
        flask --app run:app db check

  audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Audit dependencies for known vulnerabilities
      run: |
        python -m pip install --upgrade pip pip-audit
        pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build Docker image
      run: docker build -t christmas-wishlist:test .

    - name: Run the image the way production does (rootless, read-only) and check it serves
      run: |
        mkdir -p instance && sudo chown 568:568 instance
        docker run -d --name test-container -p 127.0.0.1:5000:5000 \
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
          -v "$PWD/instance:/app/instance" \
          -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
          -e APP_URL=http://localhost:5000 \
          -e SESSION_COOKIE_SECURE=False \
          -e ADMIN_EMAIL=test@example.com \
          -e ADMIN_NAME="Test Admin" \
          christmas-wishlist:test

        for i in $(seq 1 40); do
          if curl -fs http://127.0.0.1:5000/healthz >/dev/null; then break; fi
          if [ "$i" -eq 40 ]; then docker logs test-container; exit 1; fi
          sleep 1
        done

        test "$(docker exec test-container id -u)" = "568"
        test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/auth/register)" = "403"
        curl -sI http://127.0.0.1:5000/ | grep -qi '^content-security-policy:'
        docker exec test-container flask create-invite --note ci | grep -q 'invite='
        docker logs test-container
        if docker logs test-container 2>&1 | grep -E "Traceback|\[ERROR\]"; then exit 1; fi

    - name: Scheduler starts
      run: |
        docker run -d --name test-scheduler --read-only --tmpfs /tmp --cap-drop ALL \
          -v "$PWD/instance:/app/instance" \
          -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
          christmas-wishlist:test scheduler
        sleep 8
        docker logs test-scheduler
        docker exec test-scheduler python /app/healthcheck_scheduler.py

    - name: Clean up
      if: always()
      run: docker rm -f test-container test-scheduler || true
