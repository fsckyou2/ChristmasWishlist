# Local/self-hosted reference deployment. Put a TLS reverse proxy (Caddy, nginx) in front; see docs/REVERSE_PROXY.md.
# Pin `image:` to a release tag in production rather than building or using :latest.
x-app: &app
  build: .
  image: christmas-wishlist:local
  restart: unless-stopped
  env_file:
    - .env
  environment:
    - APP_ENV=production
    - TZ=America/New_York  # DAILY_DIGEST_HOUR is in this timezone
  volumes:
    - instance:/app/instance  # SQLite database; must be writable by uid/gid 568
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  web:
    <<: *app
    container_name: christmas-wishlist
    ports:
      - "127.0.0.1:5000:5000"  # only the local reverse proxy should reach the app

  scheduler:
    <<: *app
    container_name: christmas-wishlist-scheduler
    command: ["scheduler"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck_scheduler.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  instance:
