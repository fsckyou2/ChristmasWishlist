{% extends "base.html" %}

{% block title %}Log in - {{ app_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-gray-800 rounded-lg shadow-lg p-8 text-center">
    <div class="text-5xl mb-4">🎁</div>
    <h1 class="text-3xl font-bold mb-4">Welcome back, {{ user.name }}!</h1>
    <p class="text-gray-300 mb-6">Click below to finish logging in. This link can only be used once.</p>
    <form method="POST">
        {{ form.hidden_tag() }}
        <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700">
            Log in
        </button>
    </form>
</div>
{% endblock %}
