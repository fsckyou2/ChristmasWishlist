{% extends "base.html" %}

{% block title %}Invitation Required - {{ app_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-gray-800 rounded-lg shadow-lg p-8 text-center">
    <div class="text-5xl mb-4">✉️</div>
    <h1 class="text-3xl font-bold mb-4">Invitation Required</h1>
    <p class="text-gray-300 mb-6">
        {{ app_name }} is just for family. To create an account, open the invite link the family admin sent you.
    </p>
    <a href="{{ url_for('auth.login') }}" class="inline-block bg-red-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-red-700">
        Already have an account? Log in
    </a>
</div>
{% endblock %}
