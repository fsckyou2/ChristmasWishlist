<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
    <h2 style="color: #dc2626;">The family wishlists are open for a new Christmas! 🎄</h2>
    <p>Dear {{ user.name }},</p>
    <p>Last year's gifts have been cleared from everyone's lists. Now's a great time to add what you'd like this year.</p>
    <p>
        <a href="{{ app_url }}"
           style="display: inline-block; background-color: #dc2626; color: white;
                  padding: 12px 24px; text-decoration: none; border-radius: 6px; margin: 10px 0;">
            Open My Wishlist
        </a>
    </p>
    <p>Happy holidays!</p>
    {% include 'email/_signature.html' %}
</div>
